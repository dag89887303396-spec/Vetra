name: Render highlight videos

# Renders the Remotion compositions (the edited highlight videos) on a
# GitHub-hosted runner — which has open internet (can reach the Higgsfield CDN)
# and where we install Chromium — then uploads the 5 mp4s as artifacts.
#
# Triggers automatically whenever the clip list or the Remotion code changes,
# and can also be started by hand from the Actions tab.

on:
  push:
    branches: ['**']
    paths:
      - 'remotion/src/**'
      - 'remotion/package.json'
      - 'remotion/remotion.config.ts'
      - '.github/workflows/render-highlights.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remotion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: remotion/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install ffmpeg + yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          yt-dlp --version

      - name: Install Chrome Headless Shell for Remotion
        run: npx remotion browser ensure

      - name: Download source + cut clean clips
        run: npm run prepare:clips

      - name: Transcribe clips (Whisper) for captions
        run: npm run transcribe

      - name: Render all highlight videos
        run: npm run render:all

      - name: Upload rendered videos
        uses: actions/upload-artifact@v4
        with:
          name: highlight-videos
          path: remotion/out/*.mp4
          if-no-files-found: error
          retention-days: 30
